<!DOCTYPE html>
<html>
<head>
  <title>Targeting</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">

<nav class="nav">
  <a href="index.html">Risk</a>
  <a href="targeting.html" class="active">Targeting</a>
  <a href="relationships.html">Relationships</a>

<h1>Targeting</h1>

<div class="card">
  <h2>Totals Context</h2>
  <ul>
    <li>Ask total = recommended, not secured</li>
    <li>Targets = filtered records</li>
  </ul>
</div>

<div class="card">
  <table>
    <thead>
      <tr><th>Code</th><th>Type</th><th>Score</th><th>Ask</th></tr>
    </thead>
    <tbody id="table"></tbody>
  </table>
</div>

</div>

<script src="data.js"></script>
<script>
document.getElementById("table").innerHTML =
donors.map(d=>`
<tr>
<td>${d.donorCode}</td>
<td>${d.targetType}</td>
<td>${d.targetingScore}</td>
<td>${currency(d.askAmount)}</td>
</tr>`).join("");
</script>
</body>
