<!DOCTYPE html>
<html>
<head>
  <title>Risk Overview</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">

<nav class="nav">
  <a href="index.html" class="active">Risk</a>
  <a href="targeting.html">Targeting</a>
  <a href="relationships.html">Relationships</a>
</nav>

<h1>Risk Overview</h1>

<div class="kpi-grid" id="kpis"></div>

<div class="card">
  <h2>Totals Context</h2>
  <ul>
    <li>Exposure = open pledge balances</li>
    <li>Counts = record-level (not deduped)</li>
    <li>Retention = average %</li>
  </ul>
</div>

<div class="card">
  <h2>Watchlist</h2>
  <table>
    <thead>
      <tr><th>Code</th><th>Risk</th><th>Outstanding</th></tr>
    </thead>
    <tbody id="table"></tbody>
  </table>
</div>

</div>

<script src="data.js"></script>
<script>
const total = donors.length;
const exposure = donors.reduce((s,d)=>s+d.outstanding,0);
const avgRisk = Math.round(donors.reduce((s,d)=>s+d.riskScore,0)/total);

document.getElementById("kpis").innerHTML = `
<div class="card kpi"><div class="value">${total}</div>Total Records</div>
<div class="card kpi"><div class="value">${currency(exposure)}</div>Exposure</div>
<div class="card kpi"><div class="value">${avgRisk}</div>Avg Risk</div>
`;

document.getElementById("table").innerHTML =
donors.map(d=>`
<tr>
<td>${d.donorCode}</td>
<td><span class="badge ${riskTier(d.riskScore).toLowerCase()}">${riskTier(d.riskScore)}</span></td>
<td>${currency(d.outstanding)}</td>
</tr>`).join("");
</script>
</body>
</html>
